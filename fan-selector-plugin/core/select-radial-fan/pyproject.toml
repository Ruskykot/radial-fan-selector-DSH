[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fan-selector"
version = "2.4.0"
description = "Подбор радиальных вентиляторов серий ВР 86-77 и ВР 280-46 (расчётное ядро)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ruskykot" }]
keywords = ["fans", "ventilation", "selection", "вентиляторы", "подбор"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# mcp — опциональный слой API; SDK MCP требует Python >=3.11
mcp = ["mcp[cli]>=2.0"]

[project.urls]
Homepage = "https://github.com/Ruskykot/radial-fan-selector-DSH"
Repository = "https://github.com/Ruskykot/radial-fan-selector-DSH"
Issues = "https://github.com/Ruskykot/radial-fan-selector-DSH/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fan_selector*", "mcp_server*"]

# Справочники data/*.json лежат рядом с пакетом (см. repositories.py).
# В wheel они попадают в fan_selector/data/ — копирование выполняет
# build-хук из setup.py; MANIFEST.in включает их в sdist.
